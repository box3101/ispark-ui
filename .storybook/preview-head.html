<!-- Pretendard (한글 본문/UI) + JetBrains Mono (코드) -->
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.min.css" />

<style>
  /* ── 전역 docs 타이포 (모든 autodocs 페이지 공통) ───────────── */
  .sbdocs,
  .sbdocs.sbdocs-content,
  .sbdocs h1, .sbdocs h2, .sbdocs h3,
  .sbdocs p, .sbdocs li, .sbdocs td, .sbdocs th {
    font-family: "Pretendard Variable", Pretendard, -apple-system,
      BlinkMacSystemFont, system-ui, sans-serif;
  }
  .sbdocs code, .sbdocs pre, .sbdocs kbd {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sbdocs a { color: var(--color-primary, #3c69db); }
  .sbdocs.sbdocs-content h2 {
    font-weight: 650;
    font-size: 21px;
    letter-spacing: -0.01em;
    color: var(--color-text-heading, #1a1f2b);
    margin: 40px 0 14px;
  }
  .sbdocs.sbdocs-content p,
  .sbdocs.sbdocs-content li { line-height: 1.75; }

  /* 마크다운 본문 표만 (Storybook ArgTypes 표 .docblock-argstable 은 제외) */
  .sbdocs table:not(.docblock-argstable) {
    border-collapse: collapse;
    width: 100%;
    margin: 14px 0;
  }
  .sbdocs table:not(.docblock-argstable) th {
    text-align: left;
    font-weight: 600;
    font-size: 13px;
    color: var(--color-text-secondary, #6b7280);
    padding: 9px 12px;
    border: 0;
    border-bottom: 2px solid var(--color-border, #e6e8ec);
    background: none;
  }
  .sbdocs table:not(.docblock-argstable) td {
    padding: 9px 12px;
    border: 0;
    border-bottom: 1px solid var(--color-border-light, #eef0f3);
    vertical-align: top;
  }

  /* ═════════════════════════════════════════════════════════════
     Introduction 페이지 — shadcn/Radix 톤 풀-브랜드 랜딩
     색상은 모두 :root CSS 변수 사용 (main.scss → src/styles/utils/_variables.scss)
     ═════════════════════════════════════════════════════════════ */

  /* ── Hero ──────────────────────────────────────────────────── */
  .sbdocs .ispark-hero {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 8px 0 56px;
    margin-bottom: 56px;
    border-bottom: 1px solid var(--color-border-light, #eef0f3);
  }
  .sbdocs .ispark-hero__mark {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--color-primary, #3c69db);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    line-height: 1;
  }
  .sbdocs .ispark-hero__brand {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--color-text-heading, #1a1f2b);
    margin: 0 0 14px;
    line-height: 1.1;
    padding: 0;
    border: 0;
  }
  .sbdocs .ispark-hero__tag {
    font-size: 20px;
    color: var(--color-text-heading, #1a1f2b);
    margin: 0 0 6px;
    font-weight: 500;
    line-height: 1.5;
  }
  .sbdocs .ispark-hero__sub {
    font-size: 15px;
    color: var(--color-text-secondary, #6b7280);
    margin: 0 0 28px;
    line-height: 1.6;
    max-width: 560px;
  }
  .sbdocs .ispark-hero__cta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sbdocs .ispark-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none !important;
    transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
    border: 1px solid transparent;
    line-height: 1;
  }
  .sbdocs .ispark-btn--primary {
    background: var(--color-primary, #3c69db);
    color: #fff !important;
  }
  .sbdocs .ispark-btn--primary:hover {
    background: var(--color-primary-hover, #2d52b8);
  }
  .sbdocs .ispark-btn--secondary {
    background: #fff;
    color: var(--color-text-heading, #1a1f2b) !important;
    border-color: var(--color-border, #d6dae0);
  }
  .sbdocs .ispark-btn--secondary:hover {
    background: var(--color-surface, #f7f8fa);
    border-color: var(--color-text-disabled, #b9c0c9);
  }

  /* ── Section ──────────────────────────────────────────────── */
  .sbdocs .ispark-section {
    margin-bottom: 56px;
  }
  .sbdocs .ispark-section__head {
    margin-bottom: 20px;
  }
  .sbdocs .ispark-section__title {
    font-size: 22px;
    font-weight: 700;
    color: var(--color-text-heading, #1a1f2b);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    border: 0;
    padding: 0;
  }
  .sbdocs .ispark-section__desc {
    font-size: 13px;
    color: var(--color-text-secondary, #6b7280);
    margin: 0;
  }

  /* ── Card Grid ────────────────────────────────────────────── */
  .sbdocs .ispark-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .sbdocs a.ispark-card {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--color-border-light, #eef0f3);
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
    text-decoration: none !important;
    color: var(--color-text-heading, #1a1f2b) !important;
    transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
  }
  .sbdocs a.ispark-card:hover {
    border-color: var(--color-border, #c5cbd6);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(20, 30, 60, 0.06);
  }
  .sbdocs .ispark-card__demo {
    position: relative;
    display: block;
    min-height: 160px;
    padding: 0;
    background: var(--color-surface, #fafbfc);
    border-bottom: 1px solid var(--color-border-light, #eef0f3);
    overflow: hidden;
  }
  .sbdocs .ispark-card__frame {
    width: 100%;
    height: 160px;
    border: 0;
    background: transparent;
    display: block;
  }
  /* iframe 위 투명 shield — 카드 클릭은 wrapper a가 받고, iframe 안 play 함수는 영향 없음 */
  .sbdocs .ispark-card__shield {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .sbdocs .ispark-card__meta {
    padding: 12px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sbdocs .ispark-card__meta strong {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text-heading, #1a1f2b);
  }
  .sbdocs .ispark-card__meta span {
    font-size: 12px;
    color: var(--color-text-secondary, #6b7280);
  }

  /* ── Footer Links ─────────────────────────────────────────── */
  .sbdocs .ispark-foot {
    margin-top: 64px;
    padding: 28px 0 16px;
    border-top: 1px solid var(--color-border-light, #eef0f3);
  }
  .sbdocs .ispark-foot__lead {
    font-size: 11px;
    color: var(--color-text-secondary, #6b7280);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 12px;
    font-weight: 600;
  }
  .sbdocs ul.ispark-foot__links {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .sbdocs ul.ispark-foot__links li {
    margin: 0 0 6px;
    line-height: 1.6;
  }
  .sbdocs ul.ispark-foot__links a {
    font-size: 14px;
    color: var(--color-primary, #3c69db);
    text-decoration: none;
  }
  .sbdocs ul.ispark-foot__links a:hover {
    text-decoration: underline;
  }
</style>
