name: Publish to npm

# 태그 푸시 시 자동 배포 (npm run release 가 자동으로 태그를 만들고 push 함)
# 또는 GitHub UI에서 수동 실행 가능
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# id-token: write → npm Trusted Publishing(OIDC) 용.
# npmjs.com 패키지 Settings 에 Trusted Publisher 를 등록해두면
# 토큰 없이 이 워크플로가 직접 인증한다. 등록 전까지는 아래 NODE_AUTH_TOKEN 으로 폴백.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing 은 npm 11.5.1 이상에서만 동작한다
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          # Trusted Publisher 등록을 마치면 이 env 블록 전체를 지워도 된다.
          # 그 전까지는 만료 시 재발급 필요:
          #   https://www.npmjs.com/settings/leechanyong/tokens (Classic → Automation)
          #   gh secret set NPM_TOKEN
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
